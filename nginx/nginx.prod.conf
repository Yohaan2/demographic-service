# ==============================================================================
# Nginx PRODUCCIÓN - demographic-service
# ------------------------------------------------------------------------------
# - Solo acepta tráfico de la red privada (geo $allowed).
# - Balancea entre todas las réplicas de "backend" (DNS interno de Docker) con
#   hash consistente por cabecera X-Camera-Id: cada cámara cae SIEMPRE en la misma
#   réplica, porque el ByteTracker y la agregación viven en memoria por proceso.
# - nginx.conf (raíz del repo) se mantiene para desarrollo.
# ==============================================================================
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 16384;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # Access log con tiempos de petición/upstream y réplica que atendió (diagnóstico de hash y latencia)
    log_format  timed  '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                       'cam="$http_x_camera_id" rt=$request_time urt=$upstream_response_time '
                       'upstream=$upstream_addr ua="$http_user_agent"';
    access_log  /var/log/nginx/access.log  timed;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Cuerpos de hasta 10 MB; los frames típicos caben en memoria sin ir a disco
    client_max_body_size    10M;
    client_body_buffer_size 1m;
    client_body_timeout     30s;
    client_header_timeout   30s;
    send_timeout            30s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # DNS interno de Docker: re-resuelve "backend" cada 10s (réplicas que entran/salen)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Lista blanca de orígenes (Perceiver 10.232.102.111/.112/.113 y equipo de operación)
    geo $allowed {
        default         0;
        127.0.0.1       1;
        10.232.102.0/24 1;
        10.22.13.52     1;
    }

    # Clave de enrutamiento: X-Camera-Id; si falta, la IP del cliente
    map $http_x_camera_id $route_key {
        ""      $remote_addr;
        default $http_x_camera_id;
    }

    upstream backend_api {
        zone backend_api 64k;
        hash $route_key consistent;
        server backend:8000 resolve;

        keepalive 64;
        # Menor que --timeout-keep-alive 30 de Uvicorn para no reutilizar sockets ya cerrados por el backend (502)
        keepalive_timeout 25s;
        keepalive_requests 10000;
    }

    server {
        listen       80 default_server;
        server_name  _;

        if ($allowed = 0) {
            return 403;
        }

        # Cabeceras de seguridad (solo a nivel server: un add_header dentro de location las anularía)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Ajustes comunes de proxy hacia el backend
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # API de inferencia: SIN limit_req (el backpressure lo aplica cada réplica con HTTP 429)
        location /api/ {
            proxy_pass http://backend_api;
        }

        # Telemetría y salud (ya restringidas por el geo)
        location = /metrics {
            proxy_pass http://backend_api;
        }

        location = /health {
            proxy_pass http://backend_api;
        }

        # Frontend estático servido por el backend
        location / {
            proxy_pass http://backend_api;
        }
    }
}
