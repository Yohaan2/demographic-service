services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # N single-process replicas. Tracker/aggregation state is in memory per process, so Nginx
    # routes each camera (X-Camera-Id header) to the same replica with a consistent hash.
    deploy:
      replicas: ${BACKEND_REPLICAS:-8}
    env_file:
      - .env
    volumes:
      # Mount host directory for ONNX models (read-only) to inject weight files into container
      - ./models/weights:/app/models/weights:ro
    # No published ports: the backend is only reachable through Nginx on the internal network.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s  # InsightFace ONNX loads in ~2s, no PyTorch warm-up needed

  nginx:
    image: nginx:1.28-alpine
    container_name: demographic-nginx
    restart: unless-stopped
    ports:
      # Nginx is the only public entry point (serves frontend and proxies API)
      - "80:80"
    volumes:
      # Production config: IP allow-list + consistent hash by X-Camera-Id over all backend replicas
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy

  # --- Monitoring stack (opt-in): docker compose --profile monitoring up -d ---
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9100:9100"
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    command:
      - '--path.rootfs=/host'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yml:/etc/promtail/config.yml
    command:
      - -config.file=/etc/promtail/config.yml
